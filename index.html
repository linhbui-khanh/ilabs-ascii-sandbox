<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ASCII / Glyph-Dither Shader Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- favicon.svg: a mini halftone swatch (dot radius growing left->right,
       top->bottom) — the actual dithering concept this tool renders, not an
       arbitrary logo. See favicon.svg for the full comment. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      /* matches the shader's default params.bgColor/fgColor (js/main.js) —
         keeps the page background consistent before the canvas paints its
         first frame, instead of flashing the old dark theme then swapping. */
      --bg: #F8F8F6;
      --fg: #141413;
      --accent: #ff451a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
    }
    #gl-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    }
    #boot-error {
      display: none;
      position: fixed; top: 12px; left: 12px; right: 12px;
      background: #400; color: #fff; padding: 10px 14px;
      font-size: 12px; border-radius: 4px; z-index: 999;
    }
    input[type="file"] { display: none; }

    /* ---------------------------------------------------------------------
       GUI reskin — "Tier 1" pass (2026-07-28): friendlier dark theme for the
       lil-gui panels + a custom Mode tab bar (see js/main.js's
       buildModeTabBar()). Deliberately keeps lil-gui's own DOM/JS untouched —
       everything here is CSS-only, layered on top of lil-gui's existing
       custom-property theming API (the --xxx-color vars) plus a few targeted
       rules for controls lil-gui doesn't expose a variable for (checkbox ->
       toggle switch, folder title treatment, row spacing). Kept the tool's
       OWN brand accent (--accent, #ff451a) for the "on"/active states rather
       than cloning efecto's monochrome palette outright — same interaction
       patterns (toggle switches, tab bar, breathing room), our own identity.
       Explicitly NOT in this pass (out of scope, see README "Working
       conventions"): a media library/asset browser, account/avatar UI,
       cloud-sync icon — those were ruled out when this was scoped. */
    .lil-gui {
      --width: 300px;
      --background-color: #161615;
      --title-background-color: #0c0c0b;
      --widget-color: #262624;
      --hover-color: #333330;
      --focus-color: #3d3d39;
      --text-color: #ececE8;
      --title-text-color: #ececE8;
      --font-size: 12px;
      --input-font-size: 12px;
      --padding: 7px;
      --spacing: 7px;
      --widget-height: 20px;
    }
    /* the two root panels (Session / Look & Output) get a slightly bolder
       title than nested folder titles below, since they're the top-level
       "sections" of the whole tool, not a collapsible sub-group. */
    .lil-gui.root > .title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 1;
    }
    /* nested folder titles ("Effect", "Color", "Filters", ...) — softened
       from lil-gui's default filled bar into a quieter, uppercase small-caps
       label so the panel reads as calm sections rather than stacked boxes. */
    .lil-gui .lil-gui .title {
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.62;
      transition: opacity 0.15s ease;
    }
    .lil-gui .lil-gui .title:hover { opacity: 1; }
    .lil-gui .controller { padding-block: 3px; }
    .lil-gui select,
    .lil-gui input[type="text"],
    .lil-gui input[type="number"],
    .lil-gui .slider,
    .lil-gui button {
      border-radius: 6px !important;
    }

    /* Boolean controllers (Invert, Enable trail, Auto-rotate, ...) — restyle
       the native checkbox as an iOS-style toggle switch instead of lil-gui's
       default tick box. Real <input type="checkbox">, so state/onChange/
       presets/undo-redo all keep working exactly as before — appearance
       only. */
    .lil-gui .controller.boolean .widget input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      width: 34px;
      height: 18px;
      min-width: 34px;
      margin: 0;
      border-radius: 999px;
      background: var(--widget-color);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .lil-gui .controller.boolean .widget input[type="checkbox"]::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #cfcfcb;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .lil-gui .controller.boolean .widget input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .lil-gui .controller.boolean .widget input[type="checkbox"]:checked::before {
      transform: translateX(16px);
      background: #141413;
    }
    .lil-gui .controller.boolean .widget input[type="checkbox"]:focus-visible {
      box-shadow: 0 0 0 2px rgba(255, 69, 26, 0.35);
    }

    /* Generic tab bar — originally built just for "Effect" -> Mode
       (buildModeTabBar() in js/main.js), now reused as-is for "Mouse
       interaction" -> Dots/Glyphs vs 3D Object (buildMouseInteractionTabBar())
       since both are the same "replace a flat list with tabs" pattern. */
    .gui-row-hidden { display: none !important; }
    .gui-tabbar {
      display: flex;
      gap: 4px;
      margin: 6px 8px 4px;
      padding: 3px;
      background: var(--title-background-color);
      border-radius: 8px;
    }
    .gui-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: rgba(236, 236, 232, 0.55);
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.01em;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .gui-tab:hover { color: rgba(236, 236, 232, 0.85); }
    .gui-tab.active {
      background: var(--accent);
      color: #141413;
      font-weight: 600;
    }
    /* a lil-gui sub-folder used purely as a tab's content pane (its own
       title bar is redundant with the custom tab label above it, and its
       show()/hide() is driven by the tab bar instead of the usual
       click-to-collapse triangle). */
    .gui-tab-folder > .title { display: none; }
    .mode-dither-select {
      display: none; /* toggled via JS depending on active tab */
      width: calc(100% - 16px);
      margin: 0 8px 8px;
      background: var(--widget-color);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
    }
    /* Two docked GUI panels instead of one long scrolling column — see
       js/main.js's "GUI" section (guiSession / guiLook) for what lives in
       each. Both fixed to the full viewport height and independently
       scrollable, since either one can still grow taller than the screen on
       a small laptop display. */
    #gui-left, #gui-right {
      position: fixed;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      z-index: 20;
      /* keeps scrolling when the panel is taller than a shrunk browser
         window, but hides the scrollbar's own track/thumb chrome — a
         visible scrollbar riding the edge of the panel read as an
         unfinished/OS-level UI element next to the rest of the reskin. */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* legacy Edge */
    }
    #gui-left::-webkit-scrollbar, #gui-right::-webkit-scrollbar {
      display: none; /* Chrome / Safari / current Edge */
    }
    #gui-left { left: 0; }
    #gui-right { right: 0; }

    /* "Preview frame" (Look & Output -> Preview frame) — a PURELY VISUAL
       guide overlay, not a render change. The canvas keeps rendering
       full-bleed exactly as before; this just shows what a fixed-size export
       (matching a device/artboard preset, e.g. the sizes Unicorn Studio
       offers) would keep vs. crop, so Scale/Position framing can be dialed in
       here before moving the settings over to Unicorn for the real capture.
       See js/main.js's updatePreviewFrame() for the sizing math.
       - pointer-events: none — never blocks canvas mouse-interaction/drag.
       - the box-shadow (not a background/overlay div) is what dims the
         cropped-away area: a huge spread on a border-less box is a standard
         CSS trick for "spotlight everything outside this rect" without a
         second absolutely-positioned scrim element to keep in sync. */
    #preview-frame {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      display: none;
      box-sizing: border-box;
      border: 1px dashed rgba(20, 20, 19, 0.45);
      box-shadow: 0 0 0 9999px rgba(20, 20, 19, 0.35);
    }
    #preview-frame-label {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: rgba(20, 20, 19, 0.55);
      background: rgba(248, 248, 246, 0.75);
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div id="preview-frame"><div id="preview-frame-label"></div></div>

  <div id="boot-error"></div>
  <div id="gui-left"></div>
  <div id="gui-right"></div>

  <!-- One combined picker instead of a separate input per source type — the
       "Upload Media" button (Source folder) opens this and js/main.js routes
       the picked file to setSourceVideo/Image/GLB by its extension/MIME type
       (see routeUploadedFile()). OBJ/STL aren't wired in — this project only
       ever built a GLTFLoader path — but could be added the same way with
       three's OBJLoader/STLLoader if you need those formats too. -->
  <input type="file" id="media-input" accept="video/*,image/*,.glb,.gltf" />
  <input type="file" id="preset-input" accept="application/json,.json" />

  <!-- Three.js itself is loaded as an ES module inside js/main.js (import * as THREE from ".../three.module.js") —
       no separate <script> tag needed here. The import map below is required because the
       official GLTFLoader.js example (from the three@0.128.0 npm package itself, not something
       we wrote) imports Three via the BARE specifier `import ... from "three"` instead of a
       relative/full URL — without this map, the browser can't resolve that bare "three" and
       throws "Failed to resolve module specifier 'three'". -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
    }
  }
  </script>
  <!-- js/magnetism.js (DOM "magnetic hover" technique) is kept in the project as reference code
       for the REAL idea-shape elements on the live Webflow hero, but is not wired in here —
       this sandbox stays pure-canvas. The 3D source's own "Source magnetism" (3D Transform
       folder in js/main.js) is the version of this idea that actually belongs in this tool,
       since it pulls the rendered shape itself rather than needing placeholder DOM boxes.
       To try the DOM version here: add elements with a `.magnetic` class and call
       `initMagnetism(".magnetic", {...})` from js/magnetism.js. See README "Cursor magnetism". -->

  <!-- GSAP + ScrambleTextPlugin (js/scrambleText.js) are kept in the project as the "phase (a)"
       scramble-text module from the spec, but are not wired into this canvas-only demo view —
       there's no DOM headline/CTA here anymore to scramble. Add back:
         <script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.13.0/dist/gsap.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
       plus a `[data-scramble]` element and the `initScrambleText()` call in js/main.js, if/when you
       want the hero headline demo back. See README "Scramble text" + the note on gsap-trial's
       licensing before using it anywhere but localhost. -->

  <!-- gif.js: client-side GIF encoder, used by the "Also capture GIF" export
       option in js/main.js. Loaded as a classic global (window.GIF), not a
       module — its own internal Worker is spun up from a same-origin blob:
       URL that main.js builds at record time (see getGifWorkerBlobUrl()),
       NOT from this CDN URL directly, because browsers block a Worker
       script loaded cross-origin (same restriction the MSDF atlas baking
       step hit earlier with @zappar/msdf-generator — see
       tools/msdf-bake/README.md for that story). -->
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
